; CoPico ESP32-C3 Super Mini — same USB profile as other working projects:
; esp32-c3-devkitm-1 + ARDUINO_USB_MODE/CDC_ON_BOOT (native USB serial).

[platformio]
default_envs = esp32-c3-super-mini

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
lib_deps =
	hideakitai/ESP32SPISlave@^0.4.0
	greiman/SdFat@^2.2.3
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-DSPI_DRIVER_SELECT=2
	-DARDUINO_NOLOGO_ESP32C3_SUPER_MINI

; Alias for docs/scripts that reference the old env name
[env:esp32-c3-devkitm-1]
extends = env:esp32-c3-super-mini
